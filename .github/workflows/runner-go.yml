# The Go runner's CI gates (runner-go/SOAK.md):
#   - go test -race on a native Linux host
#   - CGO_ENABLED=0 builds for linux/amd64 + linux/arm64
#   - the Docker integration test is REQUIRED here (it skips locally
#     without a daemon; GitHub runners have one)
name: runner-go

on:
  push:
    branches: [main]
    paths: ["runner-go/**", "runner/lib/**", ".github/workflows/runner-go.yml"]
  pull_request:
    paths: ["runner-go/**", "runner/lib/**", ".github/workflows/runner-go.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: go vet
        working-directory: runner-go
        run: go vet ./...
      - name: gofmt
        working-directory: runner-go
        run: test -z "$(gofmt -l .)"
      - name: go test -race (Docker integration included)
        working-directory: runner-go
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Static build without Ruby
        working-directory: runner-go
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "-s -w" -o forge-ci-runner ./cmd/forge-ci-runner
          file forge-ci-runner
