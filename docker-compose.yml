# ForgeCI: the control plane (web + worker) and its Postgres, plus optional local runners.
#
#   docker compose up -d                        # http://localhost:3000
#   docker compose logs web | grep -A2 "first admin"   # the admin's password
#
# To run jobs on this machine too, set RUNNERS=1 (or more) in .env and run
# `docker compose up -d` again. RUNNERS=0, the default, starts no runner.
#
# Nothing needs configuring for a local try-out. Secrets are generated on
# first boot and kept in the forge-ci-data volume, along with logs, caches
# and artifacts. Back that volume up together with pgdata.
#
# For a real deploy set APP_HOST (and FORCE_SSL=true behind HTTPS) in .env;
# everything else in .env is optional (see .env.example and DEPLOY.md).

name: forge-ci

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forge-ci

  # Web UI and API. Background jobs run in `worker` below, so they never
  # compete with web requests. The queue and cache databases are derived from
  # DATABASE_URL (forge_ci_queue, forge_ci_cache) and created on first boot.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    env_file:
      - path: .env
        required: false
    environment: &forge-ci-env
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge_ci
      APP_HOST: ${APP_HOST:-http://localhost:3000}
      SOLID_QUEUE_IN_PUMA: "0"
    volumes:
      - forge-ci-data:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s # first boot creates the databases and loads their schemas
    networks:
      - forge-ci

  # Background jobs: reclaiming stale jobs, scaling runners, purging
  # artifacts, GitHub pipeline sync. Same image and settings as web; it starts
  # once web has prepared the databases and secrets.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ./bin/jobs
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment: *forge-ci-env
    volumes:
      - forge-ci-data:/rails/storage
    networks:
      - forge-ci

  # Runners on this machine (RUNNERS=1 or more; none by default). They drive
  # the host's Docker through its socket, so jobs run as sibling containers,
  # and read the generated runner token from the shared volume. The socket
  # gives jobs' commands root on this host: only build repositories you trust.
  runner:
    build:
      context: ./runner
    restart: unless-stopped
    deploy:
      replicas: ${RUNNERS:-0}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forge-ci-data:/forge-ci-data:ro
    environment:
      CONTROL_PLANE_URL: http://web:80
      RUNNER_TOKEN_FILE: /forge-ci-data/runner-token
      RESOURCE_CLASS: ${RUNNER_RESOURCE_CLASS:-}
    networks:
      - forge-ci

networks:
  forge-ci:
    driver: bridge

volumes:
  pgdata:
  forge-ci-data:
