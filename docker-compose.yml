# ForgeCI: the control plane and its Postgres, plus an optional local runner.
#
#   docker compose up -d                    # http://localhost:3000
#   docker compose logs web | grep password # the first admin's password
#   docker compose --profile runner up -d   # also run a runner on this machine
#
# Nothing needs configuring for a local try-out. Secrets are generated on
# first boot and kept in the forge-ci-data volume, along with logs, caches
# and artifacts. Back that volume up together with pgdata.
#
# For a real deploy set APP_HOST (and FORCE_SSL=true behind HTTPS) in .env;
# everything else in .env is optional (see .env.example and DEPLOY.md).

name: forge-ci

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forge-ci

  # Web UI, API and background jobs in one container (SOLID_QUEUE_IN_PUMA).
  # The queue and cache databases are derived from DATABASE_URL
  # (forge_ci_queue, forge_ci_cache) and created on first boot.
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge_ci
      APP_HOST: ${APP_HOST:-http://localhost:3000}
    volumes:
      - forge-ci-data:/rails/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s # first boot creates the databases and loads their schemas
    networks:
      - forge-ci

  # A runner on this machine, reading the generated token from the shared
  # volume. It needs the host's Docker socket, which some platforms (Coolify)
  # don't allow; there, install runners with the command on the Runners page.
  runner:
    profiles: ["runner"]
    build:
      context: ./runner
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - forge-ci-data:/forge-ci-data:ro
    environment:
      CONTROL_PLANE_URL: http://web:80
      RUNNER_TOKEN_FILE: /forge-ci-data/runner-token
      RESOURCE_CLASS: ${RUNNER_RESOURCE_CLASS:-}
    networks:
      - forge-ci

networks:
  forge-ci:
    driver: bridge

volumes:
  pgdata:
  forge-ci-data:
