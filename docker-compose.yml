# ForgeCI full stack — one command to run everything locally.
#
#   cp .env.example .env   # then fill in: secrets + AWS S3 bucket
#   docker compose up --build -d
#
# Pick a runner secret first (any strong random value):
#
#   openssl rand -hex 32   # put it in .env as RUNNER_TOKEN
#
# The server accepts the same value as FORGE_CI_RUNNER_TOKEN, so the runner
# connects with no further setup — no tokens to copy out of logs.
#
# Web UI: http://localhost:3000 (admin / password from .env)
#
# Object storage (job logs, artifacts, cache tarballs) is AWS S3 — create
# the bucket first (the app does not create it for you):
#
#   aws s3 mb s3://<your-bucket> --region <your-region>
#
# Push to a repo with the GitHub App installed (or POST a pipeline to the
# API — see docs/api.md) and watch jobs get claimed and run.

name: forge-ci

x-web-env: &web-env
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge_ci
  QUEUE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge_ci_queue
  CACHE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/forge_ci_cache
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?set in .env}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?set in .env}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?set in .env}
  FORGE_CI_UI_USER: ${FORGE_CI_UI_USER:-admin}
  FORGE_CI_UI_PASSWORD: ${FORGE_CI_UI_PASSWORD:-password}
  # Shared runner secret (Drone-style): set RUNNER_TOKEN to any strong random
  # value (e.g. `openssl rand -hex 32`). The server accepts it as the
  # "static-runner" token; the runner presents it as RUNNER_TOKEN. No need
  # to copy tokens out of logs.
  FORGE_CI_RUNNER_TOKEN: ${RUNNER_TOKEN:-}
  ACTIVE_STORAGE_SERVICE: amazon
  AWS_S3_BUCKET: "${AWS_S3_BUCKET:?set AWS_S3_BUCKET in .env}"
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env}
  APP_HOST: ${APP_HOST:-http://localhost:3000}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - forge-ci

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    environment: *web-env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s # db:prepare creates 3 DBs + loads schemas on first boot
    networks:
      - forge-ci

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy # ensures db:prepare (all 3 DBs) ran first
    command: ["./bin/jobs"]
    environment: *web-env
    networks:
      - forge-ci

  runner:
    build:
      context: ./runner
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      CONTROL_PLANE_URL: http://web:80
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RESOURCE_CLASS: ${RUNNER_RESOURCE_CLASS:-medium}
    # Fails fast with a clear message when RUNNER_TOKEN is empty —
    # generate one (see header) and `docker compose up -d runner`.
    networks:
      - forge-ci

networks:
  forge-ci:
    driver: bridge

volumes:
  pgdata:
