# ForgeCI control plane — Postgres is the supported database.
#
# Production and the documented setup (README) use PostgreSQL. The atomic
# runner-claim path relies on `FOR UPDATE SKIP LOCKED`, which is Postgres-only;
# on any other adapter the claim falls back to a plain ordered first-row claim
# inside a transaction (see JobRun.claim_next!). Set FORGE_CI_POSTGRES=1 in
# production to fail fast if the adapter is not Postgres.
#
# Local dev/test WITHOUT a Postgres server: point DATABASE_URL at SQLite, e.g.
#   DATABASE_URL="sqlite3:db/development.sqlite3" bin/rails s
#   DATABASE_URL="sqlite3:db/test.sqlite3"        bin/rails test
# A full Postgres URL also works here (overrides adapter/database/host/...).

default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"].presence&.inspect %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: forge_ci_web_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: forge_ci_web_test

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
production:
  primary: &primary_production
    <<: *default
    database: forge_ci_web_production
    username: forge_ci_web
    password: <%= ENV["FORGE_CI_WEB_DATABASE_PASSWORD"] %>
  # The queue (and cache) databases must be SEPARATE physical databases for
  # `bin/rails db:prepare` to load their schemas (db/queue_schema.rb,
  # db/cache_schema.rb) — sharing one DATABASE_URL makes Rails skip them as
  # "already initialized". Each falls back to DATABASE_URL when its own URL
  # isn't set.
  cache:
    <<: *primary_production
    url: <%= ENV.fetch("CACHE_DATABASE_URL", ENV["DATABASE_URL"]).presence&.inspect %>
    database: forge_ci_web_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    url: <%= ENV.fetch("QUEUE_DATABASE_URL", ENV["DATABASE_URL"]).presence&.inspect %>
    database: forge_ci_web_production_queue
    migrations_paths: db/queue_migrate
